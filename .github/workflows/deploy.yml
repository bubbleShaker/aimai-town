# 町を公開する。master に入ったものが https://bubbleshaker.github.io/aimai-town/ になる。
# テストを通過儀礼にしているのは、engine のテストが企画そのものを担保しているため
# （「どの断片を差し出しても扉は開く」「六つの終幕すべてに至る道がある」など）。
# 落ちたときに出ていくのは、仕様ではなく企画が壊れた町になる。
name: deploy

on:
  push:
    branches: [master]
  # 直せるものが無くても、手で出し直せるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は一本ずつ。走っている途中のものは畳んで、最後の master だけを出す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
